version: 2

project_name: blenau

before:
  hooks:
    - go mod tidy

builds:
  - id: blenau
    main: ./
    binary: blenau
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: getblenau
    name: cli
  draft: false
  prerelease: auto

brews:
  - name: blenau
    repository:
      owner: getblenau
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/getblenau/cli"
    description: "Blenau CLI - agent-first command-line interface for the Blenau platform."
    license: "MIT"
    skip_upload: auto
    commit_author:
      name: blenau-bot
      email: bot@blenau.com
    install: |
      bin.install "blenau"
    test: |
      system "#{bin}/blenau", "--version"

scoops:
  - name: blenau
    repository:
      owner: getblenau
      name: scoop-bucket
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/getblenau/cli"
    description: "Blenau CLI - agent-first command-line interface for the Blenau platform."
    license: "MIT"
    skip_upload: auto
    commit_author:
      name: blenau-bot
      email: bot@blenau.com
